name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - 'staging/**'
      - 'production/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Extract Kroya zip to dist
        run: |
          mkdir -p dist/kroya
          unzip -q kroya/kroya-html.zip -d dist/kroya-temp/
          mv dist/kroya-temp/kroya/* dist/kroya/
          rm -rf dist/kroya-temp

      - name: Deploy to Staging
        if: startsWith(github.ref_name, 'staging/')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CF_PAGES_PROJECT_STAGING }}

      - name: Deploy to Production
        if: startsWith(github.ref_name, 'production/')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CF_PAGES_PROJECT_PRODUCTION }} --branch=main
